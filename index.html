<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ColorSnap - เปลี่ยนรอบตัวเป็นสมุดระบายสี</title>
    <style>
        /* รีเซ็ตค่าเริ่มต้นและตั้งค่าฟอนต์ */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000;
            color: white;
            height: 100dvh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ส่วนหัวแอปพลิเคชัน (ล็อกไว้ด้านบนสุด) */
        header {
            text-align: center;
            padding: calc(15px + env(safe-area-inset-top, 0px)) 0 15px 0;
            background: #111;
            font-size: 1.5rem;
            font-weight: bold;
            flex-shrink: 0;
            z-index: 10;
            border-bottom: 1px solid #222;
        }

        .accent {
            color: #ff5e62;
        }

        /* พื้นที่ตรงกลาง (โซนแสดงกล้อง) */
        #main-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            width: 100%;
            overflow: hidden;
            position: relative;
        }

        /* กรอบภาพล็อกอัตราส่วน 3:4 */
        .camera-frame {
            width: 100%;
            aspect-ratio: 3 / 4;
            max-height: 100%;
            position: relative;
            background: #1a1a1a;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            overflow: hidden; /* ป้องกันกรอบโฟกัสล้นขอบ */
        }

        video, canvas {
            width: 100%;
            height: 100%;
            object-fit: cover; /* บังคับภาพให้เต็มกรอบ 3:4 โดยไม่ผิดสัดส่วน */
            display: block;
        }

        canvas {
            display: none;
        }

        /* ระบบ UI โฟกัสจำลอง (กรอบสีเหลือง) */
        #focus-ring {
            position: absolute;
            width: 60px;
            height: 60px;
            border: 2px solid #FFD700;
            border-radius: 10px;
            pointer-events: none; /* ให้กดทะลุได้ */
            opacity: 0;
            transform: translate(-50%, -50%) scale(1.5);
            transition: all 0.3s ease-out;
            z-index: 5;
        }

        .focus-animate {
            opacity: 1 !important;
            transform: translate(-50%, -50%) scale(1) !important;
        }

        /* แถบควบคุมการซูม (จะโชว์เมื่อมือถือรองรับ) */
        #zoom-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 300px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            padding: 10px 15px;
            border-radius: 20px;
            display: none; /* ซ่อนไว้ก่อน จะเปิดผ่าน JS */
            align-items: center;
            gap: 10px;
            z-index: 10;
        }

        #zoom-container span {
            font-size: 1.2rem;
        }

        input[type=range] {
            flex: 1;
            accent-color: #ff5e62;
        }

        /* ส่วนควบคุมด้านล่าง (ล็อกไว้ล่างสุดเสมอ) */
        .controls {
            padding: 15px 20px;
            padding-bottom: calc(15px + env(safe-area-inset-bottom, 0px));
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-shrink: 0;
            min-height: 110px;
            border-top: 1px solid #222;
        }

        button {
            border: none;
            border-radius: 30px;
            padding: 15px 20px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:active {
            transform: scale(0.95);
        }

        /* ปุ่มชัตเตอร์วงกลม */
        #snap-btn {
            background: #ff5e62;
            width: 75px;
            height: 75px;
            border-radius: 50%;
            border: 4px solid #fff;
            box-shadow: 0 0 15px rgba(255, 94, 98, 0.6);
            outline: none;
            flex-shrink: 0;
        }

        /* ปุ่มถ่ายใหม่ */
        #retake-btn {
            display: none;
            background: #333;
            color: white;
            flex: 1;
            max-width: 150px;
        }

        /* ปุ่มดำเนินการต่อ */
        #process-btn {
            display: none;
            background: #4CAF50;
            color: white;
            flex: 2;
            max-width: 250px;
            box-shadow: 0 4px 10px rgba(76, 175, 80, 0.3);
        }

        /* แจ้งเตือนข้อผิดพลาดเรื่องกล้อง */
        #error-msg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff5e62;
            text-align: center;
            padding: 20px;
            display: none;
            font-size: 1.1rem;
            background: rgba(0,0,0,0.8);
            border-radius: 10px;
            width: 80%;
            z-index: 20;
        }

        /* หน้าจอแจ้งเตือนให้หมุนกลับเป็นแนวตั้ง */
        #landscape-warning {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            background-color: #121212;
            color: white;
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .rotate-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            color: #ff5e62;
            animation: spin 2s infinite linear;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
            100% { transform: rotate(0deg); }
        }

        @media (orientation: landscape) {
            header, #main-container, .controls {
                display: none !important;
            }
            #landscape-warning {
                display: flex !important;
            }
        }
    </style>
</head>
<body>

    <!-- หน้าจอแจ้งเตือนเมื่อหมุนเครื่องเป็นแนวนอน -->
    <div id="landscape-warning">
        <div class="rotate-icon">📱</div>
        <h2>กรุณาหมุนโทรศัพท์</h2>
        <p>ColorSnap ออกแบบมาเพื่อใช้งานในแนวตั้งเท่านั้นครับ</p>
    </div>

    <header>Color<span class="accent">Snap</span></header>

    <div id="main-container">
        <!-- กรอบรูปอัตราส่วน 3:4 -->
        <div class="camera-frame" id="camera-frame">
            <video id="camera-stream" autoplay playsinline></video>
            <canvas id="photo-canvas"></canvas>
            <div id="focus-ring"></div>
            
            <!-- แถบเลื่อนซูม -->
            <div id="zoom-container">
                <span>🔍</span>
                <input type="range" id="zoom-slider" min="1" max="1" step="0.1" value="1">
            </div>

            <div id="error-msg">ไม่สามารถเข้าถึงกล้องได้ กรุณาตรวจสอบการอนุญาต</div>
        </div>
    </div>

    <div class="controls">
        <button id="snap-btn" aria-label="Take Photo"></button>
        <button id="retake-btn">ถ่ายใหม่</button>
        <button id="process-btn">แปลงเป็นภาพลายเส้น</button>
    </div>

    <script>
        const video = document.getElementById('camera-stream');
        const canvas = document.getElementById('photo-canvas');
        const ctx = canvas.getContext('2d');
        const snapBtn = document.getElementById('snap-btn');
        const retakeBtn = document.getElementById('retake-btn');
        const processBtn = document.getElementById('process-btn');
        const errorMsg = document.getElementById('error-msg');
        
        const cameraFrame = document.getElementById('camera-frame');
        const focusRing = document.getElementById('focus-ring');
        const zoomContainer = document.getElementById('zoom-container');
        const zoomSlider = document.getElementById('zoom-slider');
        
        let currentStream = null;
        let videoTrack = null;
        let focusTimeout = null;

        // เปิดกล้อง
        async function startCamera() {
            try {
                currentStream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: 'environment',
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    },
                    audio: false
                });
                
                video.srcObject = currentStream;
                errorMsg.style.display = 'none';
                
                snapBtn.style.display = 'block';
                retakeBtn.style.display = 'none';
                processBtn.style.display = 'none';

                // จัดการระบบ Zoom
                videoTrack = currentStream.getVideoTracks()[0];
                const capabilities = videoTrack.getCapabilities();
                
                // ตรวจสอบว่าเบราว์เซอร์และมือถือรองรับการซูมหรือไม่
                if (capabilities.zoom) {
                    zoomSlider.min = capabilities.zoom.min;
                    zoomSlider.max = capabilities.zoom.max;
                    zoomSlider.step = capabilities.zoom.step;
                    zoomSlider.value = capabilities.zoom.min;
                    zoomContainer.style.display = 'flex'; // โชว์แถบซูม
                } else {
                    zoomContainer.style.display = 'none'; // ซ่อนถ้าไม่รองรับ
                }

            } catch (err) {
                console.error("Error accessing the camera: ", err);
                errorMsg.style.display = 'block';
                snapBtn.style.display = 'none';
                zoomContainer.style.display = 'none';
            }
        }

        // ปิดกล้อง
        function stopCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
                currentStream = null;
            }
        }

        // Event เมื่อมีการเลื่อนแถบ Zoom
        zoomSlider.addEventListener('input', (event) => {
            if (videoTrack) {
                videoTrack.applyConstraints({
                    advanced: [{ zoom: event.target.value }]
                }).catch(err => console.log('Zoom error:', err));
            }
        });

        // Event สำหรับแตะเพื่อโฟกัส (Visual Effect)
        cameraFrame.addEventListener('click', (event) => {
            // ป้องกันไม่ให้แอนิเมชันทำงานถ้าเผลอกดโดนปุ่มซูม
            if(event.target.id === 'zoom-slider') return;

            // คำนวณตำแหน่งที่แตะเทียบกับกรอบภาพ
            const rect = cameraFrame.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;

            // ย้ายกรอบโฟกัสไปจุดที่แตะและแสดงแอนิเมชัน
            focusRing.style.left = `${x}px`;
            focusRing.style.top = `${y}px`;
            
            // รีเซ็ตแอนิเมชัน
            focusRing.classList.remove('focus-animate');
            void focusRing.offsetWidth; // Trigger reflow
            focusRing.classList.add('focus-animate');

            // ซ่อนกรอบหลังจากผ่านไป 1 วินาที
            clearTimeout(focusTimeout);
            focusTimeout = setTimeout(() => {
                focusRing.classList.remove('focus-animate');
            }, 1000);
        });

        // กดถ่ายรูป
        snapBtn.addEventListener('click', () => {
            if (!currentStream) return;

            // วาดรูปลง Canvas ด้วยขนาดจริงของเซนเซอร์กล้อง
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // สลับ UI
            video.style.display = 'none';
            zoomContainer.style.display = 'none'; // ซ่อนแถบซูมตอนถ่ายเสร็จ
            canvas.style.display = 'block';
            
            snapBtn.style.display = 'none';
            retakeBtn.style.display = 'block';
            processBtn.style.display = 'block';
        });

        // ถ่ายใหม่
        retakeBtn.addEventListener('click', () => {
            canvas.style.display = 'none';
            video.style.display = 'block';
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // เช็คว่าต้องโชว์แถบซูมไหม
            if (videoTrack && videoTrack.getCapabilities().zoom) {
                zoomContainer.style.display = 'flex';
            }

            retakeBtn.style.display = 'none';
            processBtn.style.display = 'none';
            snapBtn.style.display = 'block';
        });

        // ดำเนินการต่อ
        processBtn.addEventListener('click', () => {
            stopCamera();
            alert("รูปภาพพร้อมแล้ว! ขั้นตอนต่อไปเราจะนำภาพนี้ไปประมวลผลผ่าน OpenCV.js ครับ");
        });

        // โหลดเสร็จให้เริ่มกล้อง
        window.addEventListener('load', startCamera);
    </script>
</body>
</html>
